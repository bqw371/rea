name: vendor-boundary

# Standalone vendor-boundary gate. The main ci.yml has a cancel-in-progress
# concurrency group, so its copy of this job can get swallowed; this workflow
# has no concurrency: block so it always runs to completion. The in-ci.yml
# copy is intentionally kept too (belt-and-braces). See docs/vendor-policy.md.

on: [pull_request, push]

permissions:
  contents: read

jobs:
  vendor-boundary:
    name: vendor-boundary (no imports from third_party/)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          sparse-checkout: |
            src
            bridge
          sparse-checkout-cone-mode: false
      - name: Grep for cross-boundary imports
        timeout-minutes: 3
        shell: bash
        run: |
          set -u
          policy="See docs/vendor-policy.md #import-boundary."

          # TS/JS: import ... from '...third_party/...' / require('...third_party/...') / import('...third_party/...')
          set +e
          ts_out=$(grep -rnE "(from|require|import)[[:space:]]*\(?[[:space:]]*['\"][^'\"]*third_party/" src/ bridge/)
          ts_rc=$?
          set -e
          case "$ts_rc" in
            0) echo "$ts_out"; echo "::error::src/ or bridge/ TS/JS imports from third_party/. Shell out across a process boundary instead. $policy"; exit 1 ;;
            1) : ;;  # no match — carve-out intact
            *) echo "::error::grep (TS/JS) failed with exit $ts_rc. The vendor-boundary check did NOT actually run."; exit 1 ;;
          esac

          # Python: from third_party.X import ... / import third_party.X
          set +e
          py_out=$(grep -rnE "^[[:space:]]*(from|import)[[:space:]]+third_party[._]" src/ bridge/)
          py_rc=$?
          set -e
          case "$py_rc" in
            0) echo "$py_out"; echo "::error::src/ or bridge/ Python imports from third_party/. Shell out across a process boundary instead. $policy"; exit 1 ;;
            1) : ;;  # no match — carve-out intact
            *) echo "::error::grep (Python) failed with exit $py_rc. The vendor-boundary check did NOT actually run."; exit 1 ;;
          esac

          echo "vendor-boundary: no cross-boundary imports."
